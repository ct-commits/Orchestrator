[workspace]
members = ["src-tauri"]
resolver = "2"

[package]
name = "orchestrator"
version = "0.1.0"
edition = "2021"
description = "Local-first portfolio dashboard: roadmap parser, validator, and registry."
license = "MIT"
repository = "https://github.com/ct-commits/Orchestrator"

[lib]
name = "orchestrator"
path = "src/lib.rs"

[[bin]]
name = "orchestrator"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
# No network: our schema resolves only local $defs, so drop the HTTP
# ($ref) resolver and the reqwest/hyper stack it drags in.
jsonschema = { version = "0.28", default-features = false }
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2"

[dev-dependencies]
tempfile = "3"
