[package]
name = "orchestrator-app"
version = "0.1.0"
edition = "2021"
description = "Tauri shell for the Orchestrator portfolio dashboard."
license = "AGPL-3.0-only"

[lib]
name = "orchestrator_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
orchestrator = { path = ".." }
